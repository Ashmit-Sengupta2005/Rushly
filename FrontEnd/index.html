<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rushly — Flash-sale storefront</title>
    <meta
      name="description"
      content="Flash-sale storefront with real-time stock reservation, Stripe checkout and no overselling under load."
    />
    <meta name="theme-color" content="#111111" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Link previews (WhatsApp, LinkedIn, Slack). og:image (public/og.png) is
         injected at build time with an absolute URL — see vite.config.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rushly — Flash-sale storefront" />
    <meta
      property="og:description"
      content="Real-time stock reservation, Stripe checkout and no overselling under 500 concurrent buyers."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Apply the saved colour theme before first paint (no flash). Keep the key
         in sync with src/features/theme/accent.ts. -->
    <script>
      try {
        var accent = localStorage.getItem('rushly-accent');
        if (accent) document.documentElement.dataset.accent = accent;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
